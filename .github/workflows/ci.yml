name: CI

# The suite must pass on Linux and macOS alike. Linux is the one that matters
# most here: it is where nothing macOS-specific can hide, so a test that only
# passes on a Mac means a boundary escaped its port.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: make test

      - name: Lint
        run: make lint

  host:
    # The native host builds on both too. Its socket client is portable; only
    # signing is macOS-only, and signing identities do not belong in CI.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          # cargo-typify is compiled from source; without this every run pays
          # several minutes to rebuild a tool that never changes.
          path: |
            ~/.cargo/bin/cargo-typify
            ~/.cargo/registry
            native/target
          key: ${{ matrix.os }}-host-${{ hashFiles('native/Cargo.toml') }}

      - name: Install the schema generator
        run: cargo install cargo-typify --locked || true

      - name: Protocol artifact is current
        # The reason generated/ is committed: three languages read it, and a
        # stale one is a disagreement nobody sees until the handshake.
        run: make protocol-check-rust

      - name: The TypeScript view too
        run: make protocol-check-typescript

      - name: Gate
        run: make rust

  panel:
    # The UI is typechecked and built, not run: a webview in CI would test the
    # runner's graphics stack rather than this code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm --prefix ui ci

      - name: The TypeScript view is current
        run: make protocol-check-typescript

      - name: Build
        run: npm --prefix ui run build
