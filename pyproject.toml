[project]
name = "ev"
version = "0.1.0"
description = "Local-first personal assistant for macOS"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    # Talks to Ollama on 127.0.0.1 and nothing else. Its MockTransport is what
    # keeps the suite hermetic: no Ollama, no network, green on CI Linux.
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "mypy>=2.3,<3",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ev*", "protocol*"]

# The suite runs from the repository root without installing the package.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 88
# ruff formats Python blocks inside Markdown; the docs are prose, not source.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["ev", "tests", "protocol", "models"]
