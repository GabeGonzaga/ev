[package]
name = "ev-app"
version = "0.1.0"
description = "E.V. — the menu bar and the panel"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "ev_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# The socket client and the microphone, shared with the terminal host rather
# than written twice. Capture lives in the app because TCC attributes a
# permission to the app, not to a helper it launches (ADR 0019).
ev-host = { path = "../host" }
# The one crate here that speaks Objective-C, so this one does not have to.
ev-auth = { path = "../auth" }
# One call: SIGTERM to the daemon the app started, so its journal flushes.
# std's Child::kill is SIGKILL, which would take the last few turns with it,
# and libc::kill is unsafe -- which this crate forbids.
nix = { version = "0.31.3", features = ["signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
# image-png: the menu bar icon is a PNG drawn by icons/generate.py and
# embedded, rather than the app icon shrunk to 22 points.
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
# Hold-to-talk from anywhere. Carbon's RegisterEventHotKey under this, which
# is a key combination and not an event tap -- so it needs no Accessibility
# permission, and E.V. does not ask for one to listen for a keypress.
tauri-plugin-global-shortcut = "2"
# The panel is a floating window over whatever you were doing, so it is
# translucent like every other one macOS puts there. Vibrancy needs the window
# transparent, which is why tauri.conf says so.
window-vibrancy = "0.6"

[lints.rust]
unsafe_code = "forbid"
