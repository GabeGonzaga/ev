[package]
name = "ev-host"
version = "0.1.0"
edition = "2021"
description = "The native host: the signed process that talks to the E.V. daemon"
publish = false

[lib]
name = "ev_host"
path = "src/lib.rs"

[[bin]]
name = "ev-host"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
cpal = "0.15"
hound = "3"
serde = { workspace = true }
serde_json = { workspace = true }
# The socket, and nothing else. No HTTP client, no async runtime yet: the host
# does one blocking conversation per turn, and a runtime would be a dependency
# in search of a use until audio arrives.

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
nokhwa = { version = "0.10.11", features = ["input-avfoundation"] }
