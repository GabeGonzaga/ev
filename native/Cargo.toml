# The native side is a workspace, not a crate: the CLI host and the app share
# the socket client and the capture code, and sharing them by path dependency
# is the alternative to keeping two copies honest by hand.
[workspace]
resolver = "2"
members = ["host", "src-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
